<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Count & Flip">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Count &amp; Flip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one screen at a time — home (four big activity tiles), play (question card + three giant answers), done (stars).
   Deliberately a single bright daytime look for a young child, so colors are set explicitly for both host themes. */
:root{
  --sky:#bfe6ff;
  --sky-deep:#8fd0fb;
  --cloud:#ffffff;
  --ink:#1c2b4a;
  --ink-soft:#4f6283;
  --sun:#ffc83d;
  --sun-deep:#e6a100;
  --grass:#3fbf6f;
  --grass-deep:#259150;
  --berry:#ff6b8b;
  --berry-deep:#d9466a;
  --grape:#8f7bff;
  --grape-deep:#6a54e0;
  --sea:#2fb6d8;
  --sea-deep:#1a8fb0;
  --font:"Baloo 2", "Arial Rounded MT Bold", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%) fixed, var(--sky);
  color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.3;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 24px;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
.app{max-width:620px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; gap:14px}
button{font-family:var(--font); color:var(--ink); cursor:pointer}
button:focus-visible{outline:4px solid var(--grape); outline-offset:3px}

/* top bar */
.bar{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:52px}
.round-btn{
  width:52px; height:52px; border-radius:50%; border:3px solid var(--ink); background:var(--cloud);
  font-size:1.6rem; display:grid; place-items:center; box-shadow:0 4px 0 var(--ink); padding:0; flex:none;
}
.round-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.stars{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; font-size:1.7rem; line-height:1; min-width:0}
.stars .s{filter:grayscale(1) opacity(.35); transition:transform .3s}
.stars .s.on{filter:none; animation:pop .45s ease}
.grown{font-size:.85rem; font-weight:700; background:rgba(255,255,255,.7); border:2px solid var(--ink-soft); color:var(--ink-soft); border-radius:999px; padding:6px 12px}

/* home */
.hello{text-align:center; padding-top:4px}
.hello h1{font-size:clamp(2.4rem, 11vw, 3.6rem); line-height:1; margin:0; font-weight:800; text-wrap:balance}
.hello h1 span{color:var(--berry-deep)}
.hello p{margin:6px 0 0; font-size:1.15rem; color:var(--ink-soft); font-weight:700}
.tiles{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px}
.tile{
  border:4px solid var(--ink); border-radius:26px; padding:18px 10px 14px; background:var(--cloud);
  box-shadow:0 6px 0 var(--ink); display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0;
}
.tile:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.tile .pic{font-size:clamp(2.6rem, 12vw, 3.6rem); line-height:1}
.tile .name{font-size:1.35rem; font-weight:800; line-height:1.05}
.tile.t1{background:#fff0c2} .tile.t2{background:#ffdce4} .tile.t3{background:#d7f5e2} .tile.t4{background:#e4defe}

/* play */
.card{
  background:var(--cloud); border:4px solid var(--ink); border-radius:28px; box-shadow:0 6px 0 var(--ink);
  padding:16px 14px 18px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
}
.q{display:flex; align-items:center; justify-content:center; gap:10px; font-size:clamp(1.4rem, 6vw, 1.9rem); font-weight:800; line-height:1.1; text-wrap:balance}
.speak{
  width:48px; height:48px; border-radius:50%; border:3px solid var(--sea-deep); background:#dff6fc; font-size:1.4rem;
  display:grid; place-items:center; padding:0; flex:none;
}
.speak:active{transform:scale(.92)}
.objs{display:flex; flex-direction:column; align-items:center; gap:4px}
.objs .line{display:flex; gap:4px; justify-content:center}
.o{display:inline-block; line-height:1.05; animation:drop .35s ease backwards}
.sum{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap}
.plus{font-size:clamp(2.4rem, 10vw, 3.2rem); font-weight:800; color:var(--grape-deep)}
.listen-big{
  width:140px; height:140px; border-radius:50%; border:5px solid var(--sea-deep); background:#dff6fc;
  font-size:4rem; display:grid; place-items:center; box-shadow:0 6px 0 var(--sea-deep);
}
.listen-big:active{transform:translateY(4px); box-shadow:0 2px 0 var(--sea-deep)}
.word{font-size:2.2rem; font-weight:800}
.blocks{display:flex; gap:14px; align-items:flex-end; justify-content:center; flex-wrap:wrap; max-width:100%}
.tens{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:100%}
.rod{display:flex; flex-direction:column; gap:2px; padding:3px; background:var(--grape-deep); border-radius:6px; animation:drop .35s ease backwards}
.rod i{width:clamp(11px, 3.3vw, 16px); aspect-ratio:1; background:#c4baff; border-radius:3px; display:block}
.ones{display:grid; grid-template-columns:repeat(5, auto); gap:4px; align-content:end}
.cube{width:clamp(16px, 4.6vw, 22px); aspect-ratio:1; background:var(--sun); border:2px solid var(--sun-deep); border-radius:4px; display:block; animation:drop .35s ease backwards}
.ans.group .rod i{width:clamp(8px, 2.4vw, 12px)}
.ans.group .cube{width:clamp(13px, 3.6vw, 18px)}
.bignum{font-size:clamp(3.2rem, 15vw, 4.6rem); font-weight:800; line-height:1; background:#fff0c2; border:4px solid var(--ink); border-radius:20px; padding:10px 18px 4px; font-variant-numeric:tabular-nums}

.answers{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px}
.ans{
  min-height:104px; border-radius:24px; border:4px solid var(--ink); box-shadow:0 6px 0 var(--ink);
  font-size:clamp(3rem, 15vw, 4.4rem); font-weight:800; line-height:1; padding:8px 0 0; min-width:0;
  font-variant-numeric:tabular-nums;
}
.ans:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.ans.c0{background:#fff0c2} .ans.c1{background:#ffdce4} .ans.c2{background:#dcefff}
.pick2{display:grid; grid-template-columns:minmax(0,1fr); gap:12px}
.ans.group{min-height:auto; padding:14px 8px; font-size:1rem}
.ans.yay{background:#c9f2d8; border-color:var(--grass-deep); box-shadow:0 6px 0 var(--grass-deep); animation:bounce .6s ease}
.ans.nope{animation:wiggle .45s ease; opacity:.35}
.ans:disabled{cursor:default}

.cheer{text-align:center; font-size:1.6rem; font-weight:800; min-height:2rem; color:var(--grass-deep)}
.cheer.again{color:var(--berry-deep)}

/* done */
.done{text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; padding:10px 0}
.done .trophy{font-size:6rem; line-height:1; animation:bounce 1s ease}
.done h2{font-size:clamp(2.4rem, 10vw, 3.2rem); line-height:1; margin:0}
.done .stars{font-size:2.4rem}
.big-btn{
  border:4px solid var(--ink); border-radius:999px; padding:14px 30px 10px; font-size:1.6rem; font-weight:800;
  box-shadow:0 6px 0 var(--ink); background:var(--sun); min-width:220px;
}
.big-btn.alt{background:var(--cloud)}
.big-btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}

/* grown-ups panel */
.sheet{position:fixed; inset:0; background:rgba(28,43,74,.45); display:flex; align-items:flex-end; justify-content:center; z-index:20;
  padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px));}
.panel{background:var(--cloud); width:100%; max-width:520px; border-radius:24px 24px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:14px; font-size:1rem}
.panel h3{margin:0; font-size:1.4rem}
.panel .row{display:flex; flex-direction:column; gap:6px}
.panel .lbl{font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700}
.seg{display:flex; gap:8px; flex-wrap:wrap}
.seg button{border:3px solid var(--ink-soft); background:var(--cloud); border-radius:14px; padding:8px 16px 5px; font-size:1.1rem; font-weight:700; color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--ink); background:var(--sun); box-shadow:0 3px 0 var(--ink)}
.rec{display:flex; flex-direction:column; gap:14px}
.rec .card{gap:6px}
.rec .say-lbl{font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700}
.rec .say{font-size:clamp(2rem, 9vw, 2.8rem); font-weight:800; line-height:1.1; text-wrap:balance; min-height:2.4em; display:flex; align-items:center; justify-content:center}
.rec .state{font-size:1rem; font-weight:700; color:var(--ink-soft); min-height:1.4em}
.rec .state.ok{color:var(--grass-deep)} .rec .state.err{color:var(--berry-deep)}
.rec-row{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap}
.mic{width:96px; height:96px; border-radius:50%; border:4px solid var(--ink); background:var(--berry); box-shadow:0 6px 0 var(--ink); display:grid; place-items:center; padding:0}
.mic span{width:34px; height:34px; border-radius:50%; background:var(--cloud); display:block}
.mic.on{background:var(--berry-deep); animation:pulse 1s ease infinite}
.mic.on span{border-radius:6px}
.mic:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.small-btn{border:3px solid var(--ink); border-radius:16px; background:var(--cloud); padding:10px 16px 6px; font-size:1.1rem; font-weight:800; box-shadow:0 4px 0 var(--ink)}
.small-btn:disabled{opacity:.35; cursor:default}
.small-btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:2px solid var(--ink-soft); background:rgba(255,255,255,.75); border-radius:10px; padding:4px 9px 1px; font-size:.95rem; font-weight:700; color:var(--ink)}
.chip.done{background:#c9f2d8; border-color:var(--grass-deep)}
.chip.cur{border-color:var(--ink); box-shadow:0 0 0 2px var(--ink)}
.rec .note{font-size:.95rem; color:var(--ink); margin:0; line-height:1.4; background:rgba(255,255,255,.7); border-radius:14px; padding:10px 12px}
.panel .rec-open{background:var(--berry); color:var(--cloud)}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink), 0 0 0 0 rgba(255,107,139,.6)}50%{box-shadow:0 6px 0 var(--ink), 0 0 0 14px rgba(255,107,139,0)}}
.panel .note{font-size:.9rem; color:var(--ink-soft); margin:0; line-height:1.4}

canvas#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30}

@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes drop{from{transform:translateY(-14px) scale(.6); opacity:0}to{transform:none; opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>


<div class="app" id="app"></div>
<canvas id="fx"></canvas>

<script>
(function(){
  const THINGS = [
    ["🍎","apples"],["🐟","fish"],["⭐","stars"],["🚗","cars"],["🐶","puppies"],["🦖","dinosaurs"],
    ["🎈","balloons"],["🍌","bananas"],["🐸","frogs"],["🚀","rockets"],["🦆","ducks"],["🍓","strawberries"]
  ];
  const PRAISE = ["Yes!","Great job!","You got it!","Super!","Awesome!","Well done!"];
  const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const words = n => n === 100 ? "one hundred" : n < 20 ? ONES[n] : TENS[Math.floor(n/10)] + (n%10 ? "-" + ONES[n%10] : "");
  const ACTS = [
    {id:"count", name:"Count", pic:"🍎", cls:"t1"},
    {id:"listen", name:"Find the number", pic:"👂", cls:"t2"},
    {id:"add", name:"Add them up", pic:"➕", cls:"t3"},
    {id:"more", name:"Which has more?", pic:"⚖️", cls:"t4"}
  ];

  const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const pickOne = a => a[rand(0,a.length-1)];
  const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
  const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const saved = store.get("cf-kid") || {};
  const S = { max: saved.max || 100, voice: saved.voice || (saved.sound === false ? "off" : "phone"), round: saved.round || 5,
              screen:"home", act:null, deck:[], i:0, stars:0, busy:false, tries:0 };
  const app = document.getElementById("app");

  /* ---------- sound ---------- */
  const soundOn = () => S.voice !== "off";
  let actx = null;
  function audio(){
    if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    if(actx.state === "suspended"){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  function tone(freq, start, dur, type){
    try{
      const a = audio(); if(!a) return;
      const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  }
  const chime = () => { if(!soundOn()) return; tone(660,0,.18); tone(880,.12,.22); tone(1175,.26,.35); };
  const boop = () => { if(!soundOn()) return; tone(300,0,.2,"triangle"); tone(240,.12,.25,"triangle"); };
  function tts(text){
    try{
      const sy = window.speechSynthesis; if(!sy) return;
      sy.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85; u.pitch = 1.15; u.lang = "en-US";
      sy.speak(u);
    }catch(e){}
  }

  /* ---------- recorded voice ---------- */
  const CLIPS = [
    ["howmany","How many are there?"], ["counttens","Count the tens, then the ones."], ["findnum","Find the number"],
    ["and","and"], ["more","more"], ["altogether","How many altogether?"], ["whichmore","Which group has more?"],
    ["p0","Yes!"], ["p1","Great job!"], ["p2","You got it!"], ["p3","Super!"], ["p4","Awesome!"], ["p5","Well done!"],
    ["oops","Oops! Try again."], ["youdidit","You did it!"]
  ];
  for(let n=0; n<20; n++) CLIPS.push(["n"+n, String(n) + "  (" + ONES[n] + ")"]);
  for(let n=20; n<=90; n+=10) CLIPS.push(["n"+n, String(n) + "  (" + TENS[n/10] + ")"]);
  CLIPS.push(["n100", "100  (one hundred)"]);
  const numParts = n => n < 20 || n === 100 ? ["n"+n] : ["n" + (Math.floor(n/10)*10)].concat(n % 10 ? ["n" + (n % 10)] : []);
  const voiceBufs = {};
  let playing = [];

  const DB = {
    db: null,
    open(){
      if(DB.db) return Promise.resolve(DB.db);
      return new Promise((res, rej) => {
        try{
          const r = indexedDB.open("cf-voice", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("clips");
          r.onsuccess = () => { DB.db = r.result; res(r.result); };
          r.onerror = () => rej(r.error);
        }catch(e){ rej(e); }
      });
    },
    req(mode, fn){
      return DB.open().then(db => new Promise((res, rej) => {
        const st = db.transaction("clips", mode).objectStore("clips"), r = fn(st);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      }));
    },
    put(k, v){ return DB.req("readwrite", st => st.put(v, k)); },
    clear(){ return DB.req("readwrite", st => st.clear()); },
    keys(){ return DB.req("readonly", st => st.getAllKeys()); },
    get(k){ return DB.req("readonly", st => st.get(k)); }
  };

  function trim(buf){
    const a = audio(), d = buf.getChannelData(0), th = 0.02, pad = Math.floor(buf.sampleRate * 0.04);
    let s0 = 0, s1 = d.length - 1;
    while(s0 < d.length && Math.abs(d[s0]) < th) s0++;
    while(s1 > s0 && Math.abs(d[s1]) < th) s1--;
    if(s1 <= s0) return buf;
    s0 = Math.max(0, s0 - pad); s1 = Math.min(d.length - 1, s1 + pad);
    const out = a.createBuffer(buf.numberOfChannels, s1 - s0 + 1, buf.sampleRate);
    for(let c=0; c<buf.numberOfChannels; c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(s0, s1 + 1));
    return out;
  }
  function decode(arrayBuf){
    const a = audio(); if(!a) return Promise.reject(new Error("no audio"));
    return new Promise((res, rej) => a.decodeAudioData(arrayBuf.slice(0), b => res(trim(b)), rej));
  }
  async function loadVoice(){
    try{
      const keys = await DB.keys();
      for(const k of keys){
        try{ const v = await DB.get(k); voiceBufs[k] = await decode(v.buf); }catch(e){}
      }
    }catch(e){}
  }
  function stopVoice(){
    playing.forEach(src => { try{ src.stop(); }catch(e){} }); playing = [];
    try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  }
  function playParts(ids){
    const a = audio(); if(!a) return;
    let t = a.currentTime + 0.05;
    ids.forEach(id => {
      const src = a.createBufferSource(); src.buffer = voiceBufs[id]; src.connect(a.destination);
      src.start(t); t += voiceBufs[id].duration + 0.05; playing.push(src);
    });
  }
  function speak(parts, text){
    if(!soundOn()) return;
    stopVoice();
    if(S.voice === "mine" && parts && parts.length && parts.every(p => voiceBufs[p])) playParts(parts);
    else tts(text);
  }

  /* ---------- confetti ---------- */
  const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let bits = [], raf = 0;
  function confetti(){
    if(reduce) return;
    const dpr = window.devicePixelRatio || 1;
    fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const cols = ["#ffc83d","#ff6b8b","#3fbf6f","#8f7bff","#2fb6d8"];
    for(let k=0;k<70;k++) bits.push({x:innerWidth/2, y:innerHeight*0.45, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:Math.random()*6+4, c:pickOne(cols), a:Math.random()*6, life:70+Math.random()*30});
    if(!raf) loop();
  }
  function loop(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    bits = bits.filter(b => b.life-- > 0);
    bits.forEach(b => { b.vy += .35; b.x += b.vx; b.y += b.vy; b.a += .2; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a); ctx.fillStyle=b.c; ctx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2); ctx.restore(); });
    raf = bits.length ? requestAnimationFrame(loop) : 0;
    if(!raf) ctx.clearRect(0,0,innerWidth,innerHeight);
  }

  /* ---------- cards ---------- */
  function near(ans, lo, hi){
    const opts = hi > 20 ? [ans-10, ans+10, ans-1, ans+1, ans-2, ans+2] : [ans-1, ans+1, ans-2, ans+2];
    const set = new Set([ans]);
    shuffle(opts).forEach(v => { if(set.size < 3 && v >= lo && v <= hi) set.add(v); });
    for(let v=lo; set.size<3 && v<=hi+3; v++) set.add(v);
    return shuffle([...set]);
  }
  function blocks(n, delayStart){
    const t = Math.floor(n/10), o = n % 10, d = delayStart || 0;
    let h = '<div class="blocks" role="img" aria-label="' + t + ' tens and ' + o + ' ones">';
    if(t){ h += '<div class="tens">'; for(let k=0;k<t;k++) h += '<span class="rod" style="animation-delay:' + (d + k*70) + 'ms">' + '<i></i>'.repeat(10) + '</span>'; h += '</div>'; }
    if(o){ h += '<div class="ones">'; for(let k=0;k<o;k++) h += '<i class="cube" style="animation-delay:' + (d + t*70 + k*45) + 'ms"></i>'; h += '</div>'; }
    return h + '</div>';
  }
  const tensOnes = n => { const t = Math.floor(n/10), o = n%10; return t + (t === 1 ? " ten" : " tens") + (o ? " and " + o + (o === 1 ? " one" : " ones") : ""); };
  function objs(emoji, n, size){
    let h = '<div class="objs" style="font-size:' + size + '">';
    for(let r=0; r<n; r+=5){
      h += '<div class="line">';
      for(let k=r; k<Math.min(n, r+5); k++) h += '<span class="o" style="animation-delay:' + (k*45) + 'ms">' + emoji + '</span>';
      h += '</div>';
    }
    return h + '</div>';
  }
  const sizeFor = n => n <= 5 ? "clamp(2.6rem, 12vw, 3.4rem)" : n <= 10 ? "clamp(2.1rem, 10vw, 2.8rem)" : "clamp(1.6rem, 7.5vw, 2.2rem)";

  function makeCard(act){
    const [e, name] = pickOne(THINGS), max = S.max;
    if(act === "count"){
      const n = rand(1, max);
      if(n > 20){
        return { key:"c"+n, q:"How many blocks?", speech:"How many blocks? Count the tens, then the ones.", parts:["howmany","counttens"], winNum:n, body: blocks(n), answer:n, choices: near(n,1,max), win: tensOnes(n) + " make " + n + "!" };
      }
      return { key:"c"+n, q:"How many " + name + "?", speech:"How many " + name + "?", parts:["howmany"], winNum:n, body: objs(e, n, sizeFor(n)), answer:n, choices: near(n,1,max), win: n + "!" };
    }
    if(act === "listen"){
      const n = rand(1, max);
      return { key:"l"+n, q:"Find the number", speech:"Find the number " + n, parts:["findnum"].concat(numParts(n)), winNum:n, listen:true, n, answer:n, choices: near(n,1,max), win: n + "!" };
    }
    if(act === "add" && max > 20){
      const a = rand(10, max - 1), b = rand(1, Math.min(9, max - a)), r = a + b;
      return { key:"a"+a+"_"+b, q:"How many altogether?", speech: a + ", and " + b + " more. How many altogether?", parts: numParts(a).concat(["and"], numParts(b), ["more","altogether"]), winNum:r,
               body:'<div class="sum"><div class="bignum">' + a + '</div><span class="plus">+</span>' + objs(e,b,"clamp(1.7rem, 8vw, 2.4rem)") + '</div>',
               answer:r, choices: near(r,1,max), win: a + " and " + b + " make " + r + "!" };
    }
    if(act === "add"){
      const top = Math.min(max, 10), a = rand(1, top-1), b = rand(1, top - a), r = a + b, sz = sizeFor(Math.max(a,b)) ;
      return { key:"a"+a+"_"+b, q:"How many altogether?", speech: a + " " + name + ", and " + b + " more. How many altogether?", parts: numParts(a).concat(["and"], numParts(b), ["more","altogether"]), winNum:r,
               body:'<div class="sum">' + objs(e,a,"clamp(1.7rem, 8vw, 2.4rem)") + '<span class="plus">+</span>' + objs(e,b,"clamp(1.7rem, 8vw, 2.4rem)") + '</div>',
               answer:r, choices: near(r,1,top), win: a + " and " + b + " make " + r + "!" };
    }
    let a = rand(1, max), b = rand(1, max); while(b === a) b = rand(1, max);
    const e2 = pickOne(THINGS.filter(t => t[0] !== e));
    const groups = shuffle([{n:a, e}, {n:b, e:e2[0]}]);
    const big = Math.max(a,b), winner = groups.findIndex(g => g.n === big);
    return { key:"m"+Math.min(a,b)+"_"+big, q:"Which has more?", speech:"Which group has more?", parts:["whichmore"], winNum:big, groups, answer:winner, win: big + " is more!" };
  }

  function deck(act){
    const seen = new Set(), d = []; let g = 0;
    while(d.length < S.round && g++ < 300){ const c = makeCard(act); if(!seen.has(c.key) || g > 200){ seen.add(c.key); d.push(c); } }
    return d;
  }

  /* ---------- screens ---------- */
  function starsHTML(){
    let h = '<div class="stars" aria-label="' + S.stars + ' stars">';
    for(let k=0;k<S.round;k++) h += '<span class="s' + (k < S.stars ? " on" : "") + '" id="st-' + k + '">⭐</span>';
    return h + '</div>';
  }

  function home(){
    S.screen = "home";
    app.innerHTML =
      '<div class="bar"><span></span><button type="button" class="grown" id="grownBtn">Grown-ups ⚙︎</button></div>' +
      '<div class="hello"><h1>Count <span>&amp;</span> Flip</h1><p>Pick a game!</p></div>' +
      '<div class="tiles">' + ACTS.map(a => '<button type="button" class="tile ' + a.cls + '" id="act-' + a.id + '" data-act="' + a.id + '"><span class="pic">' + a.pic + '</span><span class="name">' + a.name + '</span></button>').join("") + '</div>';
    app.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => start(t.dataset.act)));
    document.getElementById("grownBtn").addEventListener("click", openPanel);
  }

  function start(act){
    S.act = act; S.deck = deck(act); S.i = 0; S.stars = 0;
    tone(1,0,.01); // unlock audio on iPhone with this tap
    play();
  }

  function play(){
    S.screen = "play"; S.busy = false; S.tries = 0;
    const c = S.deck[S.i];
    let body = c.body || "";
    if(c.listen){
      body = soundOn() ? '<button type="button" class="listen-big" id="listenBtn" aria-label="Hear the number again">🔊</button>'
                     : '<div class="word">' + words(c.n) + '</div>';
    }
    let answers;
    if(c.groups){
      answers = '<div class="pick2">' + c.groups.map((g,k) =>
        '<button type="button" class="ans group c' + k + '" id="ans-' + k + '" data-v="' + k + '">' + (S.max > 20 ? blocks(g.n) : objs(g.e, g.n, g.n > 10 ? "clamp(1.4rem, 6.5vw, 1.9rem)" : "clamp(1.8rem, 8vw, 2.4rem)")) + '</button>').join("") + '</div>';
    } else {
      answers = '<div class="answers">' + c.choices.map((v,k) =>
        '<button type="button" class="ans c' + k + '" id="ans-' + k + '" data-v="' + v + '">' + v + '</button>').join("") + '</div>';
    }
    app.innerHTML =
      '<div class="bar"><button type="button" class="round-btn" id="homeBtn" aria-label="Home">🏠</button>' + starsHTML() + '<span style="width:52px;flex:none"></span></div>' +
      '<div class="card"><div class="q"><span>' + c.q + '</span>' + (soundOn() ? '<button type="button" class="speak" id="speakBtn" aria-label="Say it again">🔊</button>' : '') + '</div>' + body + '</div>' +
      answers +
      '<div class="cheer" id="cheer" aria-live="polite"></div>';
    document.getElementById("homeBtn").addEventListener("click", () => { stopVoice(); home(); });
    const sp = document.getElementById("speakBtn"); if(sp) sp.addEventListener("click", () => speak(c.parts, c.speech));
    const lb = document.getElementById("listenBtn"); if(lb) lb.addEventListener("click", () => speak(c.parts, c.speech));
    app.querySelectorAll(".ans").forEach(b => b.addEventListener("click", () => answer(b)));
    setTimeout(() => speak(c.parts, c.speech), 250);
  }

  function answer(btn){
    if(S.busy || btn.disabled) return;
    const c = S.deck[S.i], cheer = document.getElementById("cheer");
    const ok = String(btn.dataset.v) === String(c.answer);
    if(ok){
      S.busy = true;
      btn.classList.add("yay");
      app.querySelectorAll(".ans").forEach(b => { if(b !== btn) b.disabled = true; });
      const recorded = PRAISE.map((x,k) => k).filter(k => voiceBufs["p"+k]);
      const pk = S.voice === "mine" && recorded.length ? pickOne(recorded) : rand(0, PRAISE.length - 1), p = PRAISE[pk];
      cheer.className = "cheer"; cheer.textContent = p + " " + c.win;
      chime(); confetti();
      setTimeout(() => speak(["p"+pk].concat(numParts(c.winNum)), p + " " + c.win), 350);
      S.stars++;
      const st = document.getElementById("st-" + (S.stars-1)); if(st) st.classList.add("on");
      setTimeout(next, 2000);
    } else {
      S.tries++;
      btn.classList.add("nope"); btn.disabled = true;
      cheer.className = "cheer again"; cheer.textContent = "Oops! Try again.";
      boop(); setTimeout(() => speak(["oops"], "Oops! Try again."), 300);
    }
  }

  function next(){
    S.i++;
    if(S.i >= S.deck.length) done(); else play();
  }

  function done(){
    S.screen = "done";
    const total = (store.get("cf-kid-stars") || 0) + S.stars; store.set("cf-kid-stars", total);
    app.innerHTML =
      '<div class="done"><div class="trophy">🏆</div><h2>You did it!</h2>' + starsHTML() +
      '<p style="margin:0;font-size:1.2rem;font-weight:700;color:var(--ink-soft)">' + total + ' stars collected so far</p>' +
      '<button type="button" class="big-btn" id="againBtn">Play again</button>' +
      '<button type="button" class="big-btn alt" id="homeBtn2">🏠 Home</button></div>';
    confetti(); chime(); setTimeout(() => speak(["youdidit"], "You did it! You got " + S.stars + " stars!"), 400);
    document.getElementById("againBtn").addEventListener("click", () => start(S.act));
    document.getElementById("homeBtn2").addEventListener("click", home);
  }

  /* ---------- grown-ups panel ---------- */
  function openPanel(){
    const seg = (key, vals, label) => '<div class="row"><span class="lbl">' + label + '</span><div class="seg">' +
      vals.map(v => '<button type="button" id="opt-' + key + '-' + v[0] + '" data-k="' + key + '" data-v="' + v[0] + '" aria-pressed="' + (String(S[key]) === String(v[0])) + '">' + v[1] + '</button>').join("") + '</div></div>';
    const sheet = document.createElement("div");
    sheet.className = "sheet"; sheet.id = "sheet";
    sheet.innerHTML = '<div class="panel" role="dialog" aria-label="Settings for grown-ups"><h3>Settings for grown-ups</h3>' +
      seg("max", [[5,"Up to 5"],[10,"Up to 10"],[20,"Up to 20"],[50,"Up to 50"],[100,"Up to 100"]], "Numbers") +
      seg("round", [[5,"5 cards"],[10,"10 cards"]], "Game length") +
      seg("voice", [["mine","My voice"],["phone","Phone voice"],["off","Off"]], "Voice") +
      '<button type="button" class="big-btn rec-open" id="recOpen">🎙 Record my voice</button>' +
      '<p class="note">Turn the iPhone\'s silent switch off to hear the voice. Above 20, numbers show as purple ten-sticks and yellow single blocks. Big adding games start from a number and add a few more.</p>' +
      '<button type="button" class="big-btn" id="closePanel">Done</button></div>';
    document.body.appendChild(sheet);
    sheet.addEventListener("click", e => { if(e.target === sheet) sheet.remove(); });
    sheet.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.k; let v = b.dataset.v;
      S[k] = k === "voice" ? v : +v;
      saveSettings();
      sheet.querySelectorAll('.seg button[data-k="' + k + '"]').forEach(x => x.setAttribute("aria-pressed", x === b));
    }));
    document.getElementById("closePanel").addEventListener("click", () => sheet.remove());
    document.getElementById("recOpen").addEventListener("click", () => { sheet.remove(); recorder(); });
  }
  function saveSettings(){ store.set("cf-kid", {max:S.max, voice:S.voice, round:S.round}); }

  /* ---------- voice recorder ---------- */
  let micStream = null, mediaRec = null, recTimer = 0;
  function recorder(startAt){
    S.screen = "rec";
    let idx = startAt != null ? startAt : Math.max(0, CLIPS.findIndex(c => !voiceBufs[c[0]]));
    let recording = false, confirmWipe = false;
    function draw(msg, cls){
      const done = CLIPS.filter(c => voiceBufs[c[0]]).length, c = CLIPS[idx], has = !!voiceBufs[c[0]];
      app.innerHTML =
        '<div class="rec">' +
        '<div class="bar"><button type="button" class="small-btn" id="recBack">← Done</button><span style="font-weight:800">' + done + ' of ' + CLIPS.length + ' recorded</span></div>' +
        '<div class="card"><span class="say-lbl">Say this · ' + (idx+1) + ' of ' + CLIPS.length + '</span>' +
          '<div class="say">' + c[1] + '</div>' +
          '<div class="rec-row">' +
            '<button type="button" class="small-btn" id="recPrev"' + (idx === 0 ? " disabled" : "") + '>← Back</button>' +
            '<button type="button" class="mic' + (recording ? " on" : "") + '" id="micBtn" aria-label="' + (recording ? "Stop recording" : "Start recording") + '"><span></span></button>' +
            '<button type="button" class="small-btn" id="recNext"' + (idx === CLIPS.length-1 ? " disabled" : "") + '>Next →</button>' +
          '</div>' +
          '<div class="state ' + (cls || "") + '" id="recState" aria-live="polite">' + (msg || (recording ? "Recording… tap the red button to stop." : has ? "✓ Recorded. Tap ▶ to listen, or the red button to redo." : "Tap the red button, say it, then tap again.")) + '</div>' +
          '<button type="button" class="small-btn" id="recPlay"' + (has ? "" : " disabled") + '>▶ Listen</button>' +
        '</div>' +
        '<p class="note">Speak close to the phone in a quiet room. Recordings stay on this iPhone only. Anything you haven\'t recorded yet uses the phone voice.</p>' +
        '<div class="chips">' + CLIPS.map((x,k) => '<button type="button" class="chip' + (voiceBufs[x[0]] ? " done" : "") + (k === idx ? " cur" : "") + '" data-k="' + k + '">' + x[1].split("  (")[0] + '</button>').join("") + '</div>' +
        '<button type="button" class="small-btn" id="recWipe" style="align-self:center">' + (confirmWipe ? "Tap again to delete all recordings" : "Delete all recordings") + '</button>' +
        '</div>';
      document.getElementById("recBack").addEventListener("click", leave);
      document.getElementById("recPrev").addEventListener("click", () => { if(!recording){ idx--; draw(); } });
      document.getElementById("recNext").addEventListener("click", () => { if(!recording){ idx++; draw(); } });
      document.getElementById("micBtn").addEventListener("click", toggle);
      document.getElementById("recPlay").addEventListener("click", () => { const b = voiceBufs[CLIPS[idx][0]]; if(b){ stopVoice(); playParts([CLIPS[idx][0]]); } });
      document.getElementById("recWipe").addEventListener("click", wipe);
      app.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => { if(!recording){ idx = +ch.dataset.k; draw(); } }));
    }
    async function toggle(){
      if(recording){ stopRec(); return; }
      if(!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        draw("This browser can't record here. Open the game from its https:// link in Safari.", "err"); return;
      }
      try{
        audio();
        if(!micStream) micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
      }catch(e){
        draw("The microphone is blocked. Allow it when Safari asks, or go to iPhone Settings → Safari → Microphone, then reload.", "err"); return;
      }
      const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
      const chunks = [], id = CLIPS[idx][0];
      try{ mediaRec = type ? new MediaRecorder(micStream, {mimeType:type}) : new MediaRecorder(micStream); }
      catch(e){ draw("Recording couldn't start. Reload the page and try again.", "err"); return; }
      mediaRec.ondataavailable = ev => { if(ev.data && ev.data.size) chunks.push(ev.data); };
      mediaRec.onstop = async () => {
        recording = false; clearTimeout(recTimer);
        try{
          const blob = new Blob(chunks, {type: mediaRec.mimeType || type || "audio/mp4"});
          const buf = await blob.arrayBuffer();
          const decoded = await decode(buf);
          if(decoded.duration < 0.15){ draw("That was too quiet. Tap the red button and try again a little louder.", "err"); return; }
          voiceBufs[id] = decoded;
          await DB.put(id, {buf, type: blob.type});
          if(S.voice === "phone"){ S.voice = "mine"; saveSettings(); }
          stopVoice(); playParts([id]);
          draw("✓ Saved. Listen, then tap Next →", "ok");
        }catch(e){ draw("That recording didn't save. Tap the red button to try again.", "err"); }
      };
      mediaRec.start();
      recording = true; draw();
      recTimer = setTimeout(stopRec, 6000);
    }
    function stopRec(){ try{ if(mediaRec && mediaRec.state !== "inactive") mediaRec.stop(); }catch(e){} }
    async function wipe(){
      if(!confirmWipe){ confirmWipe = true; draw(); return; }
      try{ await DB.clear(); }catch(e){}
      Object.keys(voiceBufs).forEach(k => delete voiceBufs[k]);
      if(S.voice === "mine"){ S.voice = "phone"; saveSettings(); }
      confirmWipe = false; idx = 0; draw("All recordings deleted.", "ok");
    }
    function leave(){
      stopRec(); stopVoice();
      if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      home();
    }
    draw();
  }

  document.addEventListener("keydown", e => {
    if(S.screen !== "play") return;
    if(/^[1-3]$/.test(e.key)){ const b = document.getElementById("ans-" + (+e.key-1)); if(b) b.click(); }
  });

  loadVoice();
  home();
})();
</script>
